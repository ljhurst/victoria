[project]
name = "victoria-agent"
version = "0.1.0"
description = "Personal admin agent — Lambda MCP server + wiki over S3"
readme = "README.md"
authors = [
    { name = "Luke Hurst", email = "llclessthanthree@gmail.com" }
]
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
victoria-core = { workspace = true }
victoria-mcp = { workspace = true }
victoria-viewer = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["victoria"]

[dependency-groups]
dev = [
    "victoria-core",
    "victoria-mcp",
    "victoria-viewer",
    "moto>=5.2.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
