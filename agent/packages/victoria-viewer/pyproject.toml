[project]
name = "victoria-viewer"
version = "0.1.0"
description = "Victoria's read-only wiki viewer — a browser to follow along with what the agent writes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "victoria-core",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mangum>=0.21.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pyyaml>=6.0.3",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[tool.uv.sources]
victoria-core = { workspace = true }

[tool.uv.build-backend]
module-name = "victoria.viewer"
namespace = true

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
