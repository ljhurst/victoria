            ---
            title: Recipes
            tags: [recipes, cooking]
            last-updated: 2026-10-01
            ---

            ## Cowboy cookies (Marie Hurst)

            From page 190 of the family cookbook, with pencil edits.

            - 1 cup shortening (Crisco, not butter)
            - 1 cup packed brown sugar (no white sugar)
            - 2 eggs
            - 2 cups flour, spooned and leveled (about 125 g per cup)
            - 1/2 tsp salt, 1/2 tsp baking powder, 1 tsp baking soda
            - 1 1/2 cups old-fashioned rolled oats (not quick oats)
            - 1 tsp vanilla
            - 12 oz chocolate chips

            Cream shortening and sugar, add eggs, stir in the dry ingredients,
            then oats, vanilla and chips. Mix minimally after the flour.
            Bake at 350F on a greased sheet for 12-13 minutes. Pull when the
            edges are set and the centers are still slightly soft; rest 5
            minutes on the pan.

            - Original used 1 cup white plus 1 cup brown sugar: the cookies
              spread and came out cakey.
            - 2026-10-23 test (1/8 batch, no vanilla): crispy outside, chewy
              inside. About 4 tbsp of dough per cookie, pressed into 3/4 inch
              pucks.

            ## Weeknight chili

            - 2 lb ground beef, 1 onion, 3 cloves garlic
            - 2 cans kidney beans, 1 can crushed tomatoes, 2 tbsp chili powder
            - Brown the beef and onion, add everything else, simmer 45 minutes.
            - Freezes well for 3 months.

            ## Sourdough

            - 500 g flour, 350 g water, 100 g starter, 10 g salt
            - Fold every 30 minutes for 2 hours, proof overnight in the fridge.
            - Bake covered at 475F for 20 minutes, uncovered for 20 more.
    evaluators:
