  - name: terse_page_from_rambling_note
    # a chatty, narrated note should still become a short factual page
    inputs:
      text: >-
        Made Grandma's cowboy cookies again tonight. This is the Marie Hurst
        recipe from page 190 of the family cookbook, the one with the pencil
        edits. Used Crisco instead of butter, that matters a lot for the
        texture. Only 1 cup of packed brown sugar and no white sugar, that's
        what the pencil edit says and it was the thing I'd been getting wrong,
        I'd been doing 1 cup white plus 1 cup brown and they spread out and
        came out cakey. Flour is 2 cups spooned and leveled, about 125 g per
        cup. Old-fashioned oats, not quick oats. Mixed as little as possible
        after the flour and oats so the dough stayed lumpy. Baked at 350 on a
        greased sheet for 12-13 minutes instead of the 15 in the printed
        recipe, pulled them when the edges were set but the centers still
        looked soft, then let them sit 5 minutes on the pan. Tested a 1/8
        batch on 2026-10-23, no vanilla because I ran out. Ended up making 3
        big cookies, about 4 tbsp of dough each, pressed into thick pucks about
        3/4 inch. Crispy outside and chewy inside, exactly what I wanted and
        the family likes the bigger size. Next time I should add the vanilla
        back and maybe try chilling the dough, and I want to ask dad how big he
        scoops them and which shortening he uses.
      domains: [house, business]
    evaluators:
      # brevity must not come from dropping facts
      - ContentIncludes:
          - Crisco
          - brown sugar
          - "350"
          - "12"
          - "2026-10-23"
          - crispy
          - chewy
          - Marie Hurst
      # a page for a 230-word note shouldn't be longer than the note
      - MaxWords: 230
      # advice, open questions and to-dos; recording something as untested or
      # unknown is allowed by the conventions, so topic words are not banned
      - ExcludesPhrases:
          - next steps
          - next time
          - questions for
          - consider
          - maybe
          - might
          - should
          - worth
          - ask dad

  - name: no_speculation_from_hedged_note
    inputs:
      text: >-
        Furnace filter is 16x25x1, replaced it 2026-10-12. Not sure if the
        garage unit takes the same size, probably does. Might switch to the
        pleated kind next time, someone said they last longer but I haven't
        checked.
      domains: [house, business]
    evaluators:
      - InDomain: house
      - ContentIncludes: ["16x25x1", "2026-10-12"]
      - ExcludesPhrases: [probably, might, "last longer", pleated]

